<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日職J1天書 2026-27版</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --panel-bg: #151c2c;
      --card-bg: #161b26;
      --border-color: #232b3e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --highlight-gold: #f59e0b;
      --section-blue: #38bdf8;
      --active-team-color: #e4032e;
      --banner-text-color: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header Bar */
    header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text-muted);
    }

    .selector-bar {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .selector-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    select {
      background-color: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      outline: none;
    }

    /* Team Switch Buttons */
    .match-fixture-bar {
      display: flex;
      gap: 12px;
      padding: 10px 16px;
      background-color: var(--bg-main);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .team-btn {
      flex: 1;
      padding: 8px 16px;
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--text-main);
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .team-btn.active {
      background-color: var(--active-team-color);
      border-color: var(--active-team-color);
      color: var(--banner-text-color);
    }

    /* Main Viewport */
    .app-viewport {
      display: flex;
      flex: 1;
      height: calc(100vh - 100px);
      overflow: hidden;
    }

    /* Left Navigation Sidebar */
    .sidebar {
      width: 280px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 4px;
      background-color: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.88rem;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .nav-item.active {
      background-color: rgba(255, 255, 255, 0.08);
      border-color: var(--border-color);
      border-left: 4px solid var(--active-team-color);
      font-weight: bold;
    }

    .nav-item .number {
      font-weight: bold;
      color: #94a3b8;
      width: 32px;
      display: inline-block;
    }

    .nav-item.active .number {
      color: var(--text-main);
    }

    .nav-item .name { flex: 1; }

    .nav-item .pos-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: bold;
    }

    .nav-item-info {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      margin-bottom: 6px;
    }

    /* Right Main Nishikawa Template View */
    .detail-view {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background-color: var(--bg-main);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      max-width: 1050px;
      margin: 0 auto;
    }

    /* Dynamic Title Banner with Logo Placement */
    .card-banner {
      background: linear-gradient(90deg, var(--active-team-color) 0%, rgba(0, 0, 0, 0.4) 100%);
      padding: 16px 20px;
      border-radius: 6px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .banner-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .banner-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .banner-top h2 {
      margin: 0;
      font-size: 1.4rem;
      color: var(--banner-text-color);
    }

    .badge-reg {
      background-color: #10b981;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .banner-subtext {
      font-size: 0.85rem;
      color: var(--banner-text-color);
      opacity: 0.9;
      margin-top: 2px;
    }

    /* Team Logo inside Header Banner */
    .team-logo-banner {
      width: 52px;
      height: 52px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      flex-shrink: 0;
    }

    /* 3-Column Metadata Grid */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      background-color: rgba(0, 0, 0, 0.25);
      padding: 14px 18px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.88rem;
    }

    .meta-grid div {
      display: flex;
      flex-direction: column;
    }

    .meta-grid label {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-bottom: 4px;
    }

    .meta-grid span {
      font-weight: bold;
      color: var(--text-main);
    }

    /* Section Headings */
    .section-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--section-blue);
      margin-top: 22px;
      margin-bottom: 8px;
    }

    .section-content {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    /* Milestone Inline Badge */
    .milestone-badge {
      background-color: #d97706;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
      margin-right: 8px;
    }

    /* Trivia Lightbulb Box */
    .trivia-box {
      background-color: rgba(245, 158, 11, 0.08);
      border-left: 3px solid var(--highlight-gold);
      padding: 10px 14px;
      font-size: 0.88rem;
      margin-top: 8px;
      color: #fef08a;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 0 4px 4px 0;
    }

    /* Timeline Table */
    .nishikawa-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0 16px 0;
      font-size: 0.88rem;
      background-color: rgba(0, 0, 0, 0.2);
    }

    .nishikawa-table th {
      background-color: rgba(255, 255, 255, 0.04);
      color: var(--section-blue);
      text-align: left;
      padding: 10px 12px;
      font-size: 0.8rem;
      border-bottom: 1px solid var(--border-color);
    }

    .nishikawa-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
    }

    ul.detail-bullets {
      margin: 6px 0 16px 20px;
      padding: 0;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    ul.detail-bullets li { margin-bottom: 4px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--panel-bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-title">日職J1天書 2026-27版 （評述員用）</div>
    <div class="selector-bar">
      <div class="selector-group">
        <label for="select-team-a">主隊:</label>
        <select id="select-team-a"></select>
      </div>
      <div class="selector-group">
        <label for="select-team-b">客隊:</label>
        <select id="select-team-b"></select>
      </div>
    </div>
  </header>

  <!-- Team Switch Buttons -->
  <nav class="match-fixture-bar">
    <button class="team-btn active" id="btn-team-a" onclick="setActiveTeam('A')">柏太陽王 (Kashiwa)</button>
    <button class="team-btn" id="btn-team-b" onclick="setActiveTeam('B')">浦和紅鑽 (Urawa)</button>
  </nav>

  <!-- Main Viewport -->
  <div class="app-viewport">
    <aside class="sidebar">
      <div class="nav-scroll" id="sidebar-nav-list"></div>
    </aside>

    <main class="detail-view" id="main-card-container"></main>
  </div>

  <script>
    const ALL_J1_TEAMS = [
      "鹿島鹿角", "水戶蜀葵", "浦和紅鑽", "千葉市原JEF聯", "柏太陽王",
      "FC東京", "町田澤維亞", "東京綠茵", "川崎前鋒", "名古屋鯨魚",
      "橫濱水手", "清水心跳", "京都不死鳥", "大阪飛腳", "大阪櫻花",
      "神戶勝利船", "岡山綠雉", "廣島三箭", "福岡黃蜂", "長崎成功丸"
    ];

    // J1 Home Kit Colors Matrix
    const TEAM_COLORS = {
      "鹿島鹿角": { bg: "#b8193f", text: "#ffffff" },
      "水戶蜀葵": { bg: "#005bac", text: "#ffffff" },
      "浦和紅鑽": { bg: "#e6002d", text: "#ffffff" },
      "千葉市原JEF聯": { bg: "#ffe100", text: "#111827" },
      "柏太陽王": { bg: "#fff100", text: "#111827" },
      "FC東京": { bg: "#11216c", text: "#ffffff" },
      "町田澤維亞": { bg: "#0054a7", text: "#ffffff" },
      "東京綠茵": { bg: "#006d30", text: "#ffffff" },
      "川崎前鋒": { bg: "#38a1db", text: "#ffffff" },
      "名古屋鯨魚": { bg: "#e6002d", text: "#ffffff" },
      "橫濱水手": { bg: "#004098", text: "#ffffff" },
      "清水心跳": { bg: "#f39800", text: "#111827" },
      "京都不死鳥": { bg: "#750069", text: "#ffffff" },
      "大阪飛腳": { bg: "#00458d", text: "#ffffff" },
      "大阪櫻花": { bg: "#da005c", text: "#ffffff" },
      "神戶勝利船": { bg: "#a9002e", text: "#ffffff" },
      "岡山綠雉": { bg: "#b6003d", text: "#ffffff" },
      "廣島三箭": { bg: "#51318f", text: "#ffffff" },
      "福岡黃蜂": { bg: "#001b5b", text: "#ffffff" },
      "長崎成功丸": { bg: "#005bac", text: "#ffffff" },
      "DEFAULT": { bg: "#0284c7", text: "#ffffff" }
    };

    // File name mapping for local logos in logos/ directory
    const TEAM_LOGOS = {
      "鹿島鹿角": "logos/japan_kashima-antlers.football-logos.cc.svg",
      "水戶蜀葵": "logos/japan_mito-hollyhock.football-logos.cc.svg",
      "浦和紅鑽": "logos/japan_urawa-reds.football-logos.cc.svg",
      "千葉市原JEF聯": "logos/japan_jef-united-chiba.football-logos.cc.svg",
      "柏太陽王": "logos/japan_kashiwa-reysol.football-logos.cc.svg",
      "FC東京": "logos/japan_fc-tokyo.football-logos.cc.svg",
      "町田澤維亞": "logos/japan_machida-zelvia.football-logos.cc.svg",
      "東京綠茵": "logos/japan_tokyo-verdy.football-logos.cc.svg",
      "川崎前鋒": "logos/japan_kawasaki-frontale.football-logos.cc.svg",
      "名古屋鯨魚": "logos/japan_nagoya-grampus.football-logos.cc.svg",
      "橫濱水手": "logos/japan_yokohama-f-marinos.football-logos.cc.svg",
      "清水心跳": "logos/japan_shimizu-s-pulse.football-logos.cc.svg",
      "京都不死鳥": "logos/japan_kyoto-sanga.football-logos.cc.svg",
      "大阪飛腳": "logos/japan_gamba-osaka.football-logos.cc.svg",
      "大阪櫻花": "logos/japan_cerezo-osaka.football-logos.cc.svg",
      "神戶勝利船": "logos/japan_vissel-kobe.football-logos.cc.svg",
      "岡山綠雉": "logos/japan_fagiano-okayama.football-logos.cc.svg",
      "廣島三箭": "logos/japan_sanfrecce-hiroshima.football-logos.cc.svg",
      "福岡黃蜂": "logos/japan_avispa-fukuoka.football-logos.cc.svg",
      "長崎成功丸": "logos/japan_v-varen-nagasaki.football-logos.cc.svg"
    };

    // Keep completed database records stable while showing TVB's preferred team names.
    const TEAM_DATA_KEYS = {
      "FC東京": "FC 東京"
    };

    const TEAM_DISPLAY_NAMES = {
      "FC 東京": "FC東京"
    };

    function getTeamDisplayName(databaseName) {
      return TEAM_DISPLAY_NAMES[databaseName] || databaseName;
    }

    let globalDatabase = [];
    let activeTeamSlot = 'A';
    let activeSelectedId = null;

    function populateDropdowns() {
      const selectA = document.getElementById('select-team-a');
      const selectB = document.getElementById('select-team-b');

      selectA.innerHTML = '';
      selectB.innerHTML = '';

      ALL_J1_TEAMS.forEach(team => {
        const optA = document.createElement('option');
        optA.value = team;
        optA.textContent = team;
        if (team === "柏太陽王") optA.selected = true;
        selectA.appendChild(optA);

        const optB = document.createElement('option');
        optB.value = team;
        optB.textContent = team;
        if (team === "浦和紅鑽") optB.selected = true;
        selectB.appendChild(optB);
      });

      selectA.addEventListener('change', () => { updateFixtureButtons(); renderActiveTeamView(); });
      selectB.addEventListener('change', () => { updateFixtureButtons(); renderActiveTeamView(); });

      updateFixtureButtons();
    }

    function updateFixtureButtons() {
      const teamA = document.getElementById('select-team-a').value;
      const teamB = document.getElementById('select-team-b').value;

      document.getElementById('btn-team-a').textContent = `${teamA}`;
      document.getElementById('btn-team-b').textContent = `${teamB}`;
    }

    function setActiveTeam(slot) {
      activeTeamSlot = slot;
      activeSelectedId = null;

      document.getElementById('btn-team-a').classList.toggle('active', slot === 'A');
      document.getElementById('btn-team-b').classList.toggle('active', slot === 'B');

      const currentTeamName = document.getElementById(slot === 'A' ? 'select-team-a' : 'select-team-b').value;
      const theme = TEAM_COLORS[currentTeamName] || TEAM_COLORS["DEFAULT"];
      
      document.documentElement.style.setProperty('--active-team-color', theme.bg);
      document.documentElement.style.setProperty('--banner-text-color', theme.text);

      renderActiveTeamView();
    }

    function renderActiveTeamView() {
      const currentTeamName = document.getElementById(activeTeamSlot === 'A' ? 'select-team-a' : 'select-team-b').value;
      const sidebarContainer = document.getElementById('sidebar-nav-list');

      const databaseTeamName = TEAM_DATA_KEYS[currentTeamName] || currentTeamName;
      const teamItems = globalDatabase.filter(item => item.club === databaseTeamName);

      if (teamItems.length === 0) {
        sidebarContainer.innerHTML = `<div style="padding:16px; color:var(--text-muted); text-align:center;">⚠️ 陣容資料建置中</div>`;
        document.getElementById('main-card-container').innerHTML = `
          <div style="padding:40px; color:var(--text-muted); text-align:center;">
            <h3>${currentTeamName}</h3>
            <p>陣容資料尚未加入資料庫中。</p>
          </div>
        `;
        return;
      }

      const teamInfo = teamItems.find(i => i.type === "team_info");
      const manager = teamItems.find(i => i.position === "HC" || i.position === "MANAGER");
      const players = teamItems.filter(i => i.position !== "HC" && i.position !== "MANAGER" && i.type !== "team_info")
                               .sort((a, b) => parseInt(a.number) - parseInt(b.number));

      let sidebarHTML = '';

      if (teamInfo) {
        const isActive = activeSelectedId === teamInfo.id ? 'active' : '';
        sidebarHTML += `
          <div class="nav-item nav-item-info ${isActive}" onclick="selectItem('${teamInfo.id}')">
            <span>🏛️ 球隊概覽 (Team Info)</span>
          </div>
        `;
      }

      if (manager) {
        const isActive = activeSelectedId === manager.id ? 'active' : '';
        sidebarHTML += `
          <div class="nav-item ${isActive}" onclick="selectItem('${manager.id}')">
            <span class="number">#HC</span>
            <span class="name">${manager.name_zh || manager.name_en}</span>
            <span class="pos-tag">HC</span>
          </div>
        `;
      }

      players.forEach(p => {
        const isActive = activeSelectedId === p.id ? 'active' : '';
        sidebarHTML += `
          <div class="nav-item ${isActive}" onclick="selectItem('${p.id}')">
            <span class="number">#${p.number}</span>
            <span class="name">${p.name_zh || p.name_en}</span>
            <span class="pos-tag">${p.position}</span>
          </div>
        `;
      });

      sidebarContainer.innerHTML = sidebarHTML;

      if (!activeSelectedId) {
        if (teamInfo) selectItem(teamInfo.id);
        else if (players.length > 0) selectItem(players[0].id);
      }
    }

    function selectItem(id) {
      activeSelectedId = id;
      renderActiveTeamView();

      const item = globalDatabase.find(x => x.id === id);
      const detailContainer = document.getElementById('main-card-container');
      if (!item) return;

      const displayClubName = getTeamDisplayName(item.club);
      const logoUrl = TEAM_LOGOS[displayClubName] || TEAM_LOGOS[item.club] || '';

      // Team Info Card
      if (item.type === "team_info") {
        detailContainer.innerHTML = `
          <article class="card">
            <div class="card-banner">
              <div class="banner-left">
                <div class="banner-top">
                  <h2>${displayClubName} (${item.club_en})</h2>
                </div>
                <div class="banner-subtext">J1 聯賽球會檔案 • 隊名由來與場館數據</div>
              </div>
              ${logoUrl ? `<img src="${logoUrl}" alt="${item.club} Logo" class="team-logo-banner" onerror="this.style.display='none';">` : ''}
            </div>
            <div class="meta-grid">
              <div><label>主場城市 / 人口</label><span>${item.hometown || '-'} (${item.hometown_population || '-'})</span></div>
              <div><label>主場球場</label><span>${item.stadium_info?.name || '-'}</span></div>
              <div><label>球場容量 / 建成年份</label><span>${item.stadium_info?.capacity?.toLocaleString() || '-'} 人 (${item.stadium_info?.year_built || '-'}年)</span></div>
            </div>
            ${item.name_history ? `<div class="section-title">隊名歷史與由來</div><div class="section-content">${item.name_history}</div>` : ''}
            ${item.team_history ? `<div class="section-title">球會發展歷史</div><div class="section-content">${item.team_history}</div>` : ''}
            ${item.performance_history ? `<div class="section-title">主要榮譽紀錄</div><ul class="detail-bullets">${item.performance_history.map(h => `<li>${h}</li>`).join('')}</ul>` : ''}
            ${item.stadium_info?.interesting_facts ? `<div class="section-title">主場球場資訊與趣聞</div><ul class="detail-bullets">${item.stadium_info.interesting_facts.map(f => `<li>${f}</li>`).join('')}</ul>` : ''}
          </article>
        `;
        return;
      }

      // Exact Nishikawa Standard Player View
      detailContainer.innerHTML = `
        <article class="card">
          <!-- Header Banner -->
          <div class="card-banner">
            <div class="banner-left">
              <div class="banner-top">
                <h2>#${item.number || '-'} ${item.name_zh || item.name_en} (${item.name_en})</h2>
                <span class="badge-reg">${item.registration_status || '本國球員'}</span>
              </div>
              <div class="banner-subtext">${item.position} • ${displayClubName} &nbsp;&nbsp;<span style="opacity:0.6;">[ID: ${item.id}]</span></div>
            </div>
            ${logoUrl ? `<img src="${logoUrl}" alt="${item.club} Logo" class="team-logo-banner" onerror="this.style.display='none';">` : ''}
          </div>

          <!-- 3-Column Metadata Grid -->
          <div class="meta-grid">
            <div>
              <label>出生日期 / 年齡</label>
              <span>${item.dob || '-'} (${item.age ? item.age + '歲' : '-'})</span>
            </div>
            <div>
              <label>國籍 / 慣用腳</label>
              <span>${item.nationality || '-'} / ${item.foot || '-'}</span>
            </div>
            <div>
              <label>身高 / 體重</label>
              <span>${item.height ? item.height + ' cm' : '-'} / ${item.weight ? item.weight + ' kg' : '-'}</span>
            </div>
            <div>
              <label>加盟狀態</label>
              <span>${item.joined ? item.joined + '年' : '-'} (${item.tenure_status || '-'})</span>
            </div>
            <div>
              <label>前屬球會</label>
              <span>${item.prev_club || '-'}</span>
            </div>
            <div>
              <label>國家隊履歷</label>
              <span>${item.national_team_detail || '無'}</span>
            </div>
          </div>

          <!-- 1. 簡介與戰術定位 -->
          ${item.intro ? `
            <div class="section-title">簡介與戰術定位</div>
            <div class="section-content" style="font-weight: bold; color: #f8fafc;">${item.intro}</div>
          ` : ''}

          <!-- 2. 美式數據紀錄與即將達成里程碑 -->
          ${item.milestones?.length ? `
            <div class="section-title">美式數據紀錄與即將達成里程碑</div>
            <ul class="detail-bullets">
              ${item.milestones.map(m => `<li><span class="milestone-badge">里程碑</span>${m}</li>`).join('')}
            </ul>
          ` : ''}

          <!-- 3. 個人趣聞與出身背景 -->
          ${item.quirky_trivia ? `
            <div class="section-title">個人趣聞與出身背景</div>
            <div class="trivia-box">
              <span>💡</span>
              <div>${item.quirky_trivia}</div>
            </div>
          ` : ''}

          <!-- 4. 完整生涯與青訓發展時間軸 -->
          ${item.timeline?.length ? `
            <div class="section-title">完整生涯與青訓發展時間軸</div>
            <table class="nishikawa-table">
              <thead>
                <tr>
                  <th style="width: 25%;">期間</th>
                  <th style="width: 25%;">效力球隊 / 層級</th>
                  <th style="width: 15%;">類別</th>
                  <th style="width: 35%;">關鍵里程碑與青訓發展</th>
                </tr>
              </thead>
              <tbody>
                ${item.timeline.map(t => `
                  <tr>
                    <td><strong>${t.period}</strong></td>
                    <td>${t.team}</td>
                    <td>${t.category || 'J1職業隊'}</td>
                    <td>${t.milestone}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : ''}

          <!-- 5. 生涯主要榮譽細節 -->
          ${item.honors?.length ? `
            <div class="section-title">生涯主要榮譽細節</div>
            <ul class="detail-bullets">
              ${item.honors.map(h => `<li>${h}</li>`).join('')}
            </ul>
          ` : ''}

          <!-- 6. 青訓成長與技術發展特質 -->
          ${item.tactical_traits?.length ? `
            <div class="section-title">青訓成長與技術發展特質</div>
            <ul class="detail-bullets">
              ${item.tactical_traits.map(tt => `<li>${tt}</li>`).join('')}
            </ul>
          ` : ''}

        </article>
      `;
    }

    async function loadPortalData() {
      try {
        const response = await fetch('players_db.json');
        globalDatabase = await response.json();
        populateDropdowns();
        setActiveTeam('A');
      } catch (err) {
        console.error("Data load failed:", err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadPortalData);
  </script>
</body>
</html>
