<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J1 League Commentary Portal</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent-color: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --highlight: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 2px solid var(--card-border);
      padding-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 1.8rem;
      color: var(--text-main);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    #portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .badge {
      background-color: var(--accent-color);
      color: #fff;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.85rem;
    }

    .badge-fw { background-color: #e11d48; }
    .badge-mf { background-color: #10b981; }
    .badge-df { background-color: #2563eb; }
    .badge-gk { background-color: #d97706; }
    .badge-team { background-color: #8b5cf6; }

    .meta-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.9rem;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 10px;
      border-radius: 6px;
    }

    .meta-item strong {
      color: var(--text-muted);
    }

    .section-title {
      font-weight: bold;
      color: var(--accent-color);
      margin-top: 12px;
      margin-bottom: 4px;
      font-size: 0.95rem;
    }

    ul, ol {
      margin: 4px 0 12px 20px;
      padding: 0;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .trivia-box {
      background-color: rgba(245, 158, 11, 0.1);
      border-left: 3px solid var(--highlight);
      padding: 8px 12px;
      font-size: 0.85rem;
      margin-top: 12px;
      border-radius: 0 6px 6px 0;
    }

    .error-msg {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>

  <header>
    <h1>J1 League 賽事播報資料庫</h1>
    <div class="subtitle">即時球員個人檔案與球隊戰術資訊調閱門戶</div>
  </header>

  <main id="portal-grid">
    <div>載入資料中...</div>
  </main>

  <script>
    async function loadPortalData() {
      const grid = document.getElementById('portal-grid');
      try {
        const response = await fetch('data.json');
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        const items = await response.json();

        grid.innerHTML = items.map(item => {
          // Render Team Card
          if (item.type === "team_info") {
            return `
              <article class="card">
                <div class="card-header">
                  <h2>${item.club} (${item.club_en})</h2>
                  <span class="badge badge-team">球隊資訊</span>
                </div>
                <div class="meta-list">
                  <div class="meta-item"><strong>主場城市:</strong> ${item.hometown}</div>
                  <div class="meta-item"><strong>城市人口:</strong> ${item.hometown_population}</div>
                  <div class="meta-item"><strong>球場名稱:</strong> ${item.stadium_info?.name || 'N/A'}</div>
                  <div class="meta-item"><strong>容納人數:</strong> ${item.stadium_info?.capacity?.toLocaleString() || 'N/A'} 人</div>
                </div>
                <div class="section-title">隊名由來</div>
                <p style="font-size: 0.9rem; color: #cbd5e1; margin-top: 4px;">${item.name_history}</p>
                
                <div class="section-title">隊史榮譽</div>
                <ul>
                  ${(item.performance_history || []).map(h => `<li>${h}</li>`).join('')}
                </ul>

                <div class="section-title">球場亮點</div>
                <ul>
                  ${(item.stadium_info?.interesting_facts || []).map(f => `<li>${f}</li>`).join('')}
                </ul>
              </article>
            `;
          }

          // Render Player Card
          const posClass = `badge-${(item.position || '').toLowerCase()}`;
          return `
            <article class="card">
              <div class="card-header">
                <h2>#${item.number || '-'} ${item.name_zh || item.name_en} (${item.name_en})</h2>
                <span class="badge ${posClass}">${item.position || 'N/A'}</span>
              </div>
              <div class="meta-list">
                <div class="meta-item"><strong>效力球隊:</strong> ${item.club}</div>
                <div class="meta-item"><strong>國籍/註冊:</strong> ${item.nationality} (${item.registration_status})</div>
                <div class="meta-item"><strong>年齡/生日:</strong> ${item.age}歲 (${item.dob})</div>
                <div class="meta-item"><strong>身高/體重:</strong> ${item.height}cm / ${item.weight}kg</div>
                <div class="meta-item"><strong>慣用腳:</strong> ${item.foot}</div>
                <div class="meta-item"><strong>前屬球隊:</strong> ${item.prev_club}</div>
              </div>

              ${item.intro ? `<p style="font-size: 0.9rem; margin-top: 8px;">${item.intro}</p>` : ''}

              ${item.tactical_traits?.length ? `
                <div class="section-title">戰術特徵</div>
                <ul>${item.tactical_traits.map(t => `<li>${t}</li>`).join('')}</ul>
              ` : ''}

              ${item.timeline?.length ? `
                <div class="section-title">職涯時間軸</div>
                <ul>${item.timeline.map(t => `<li><strong>${t.period} (${t.team}):</strong> ${t.milestone}</li>`).join('')}</ul>
              ` : ''}

              ${item.quirky_trivia ? `
                <div class="trivia-box">
                  <strong>播報花絮:</strong> ${item.quirky_trivia}
                </div>
              ` : ''}
            </article>
          `;
        }).join('');

      } catch (err) {
        grid.innerHTML = `
          <div class="error-msg">
            <strong>資料載入失敗:</strong> 無法解析 data.json。請檢查 JSON 語法是否正確。<br>
            <small>${err.message}</small>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadPortalData);
  </script>
</body>
</html>
