<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J1 League Commentary Portal</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent-color: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --highlight: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--card-border);
      padding-bottom: 16px;
    }

    .header-title h1 { margin: 0 0 6px 0; font-size: 1.8rem; }
    .header-title .subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .team-selectors {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .selector-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .selector-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--accent-color);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      outline: none;
    }

    select:focus {
      box-shadow: 0 0 0 2px var(--accent-color);
    }

    .dual-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 28px;
    }

    .team-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .column-header {
      font-size: 1.3rem;
      font-weight: bold;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent-color);
      color: var(--accent-color);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .card-header h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .badge {
      background-color: var(--accent-color);
      color: #fff;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.85rem;
    }

    .badge-fw { background-color: #e11d48; }
    .badge-mf { background-color: #10b981; }
    .badge-df { background-color: #2563eb; }
    .badge-gk { background-color: #d97706; }
    .badge-manager { background-color: #64748b; }
    .badge-team { background-color: #8b5cf6; }

    .meta-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.88rem;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 10px;
      border-radius: 6px;
    }

    .meta-item strong { color: var(--text-muted); }
    .section-title { font-weight: bold; color: var(--accent-color); margin-top: 12px; margin-bottom: 4px; font-size: 0.95rem; }
    ul { margin: 4px 0 12px 20px; padding: 0; font-size: 0.9rem; color: #cbd5e1; }

    .trivia-box {
      background-color: rgba(245, 158, 11, 0.1);
      border-left: 3px solid var(--highlight);
      padding: 8px 12px;
      font-size: 0.85rem;
      margin-top: 12px;
      border-radius: 0 6px 6px 0;
    }

    .empty-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--card-border);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      color: var(--text-muted);
    }

    .error-card {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      padding: 20px;
      border-radius: 8px;
      color: #f87171;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>J1 League 賽事播報資料庫</h1>
      <div class="subtitle">即時球員個人檔案與球隊戰術資訊調閱門戶</div>
    </div>

    <div class="team-selectors">
      <div class="selector-group">
        <label for="select-team-a">主隊選擇 (Team A)</label>
        <select id="select-team-a"></select>
      </div>
      <div class="selector-group">
        <label for="select-team-b">客隊選擇 (Team B)</label>
        <select id="select-team-b"></select>
      </div>
    </div>
  </header>

  <main class="dual-grid">
    <section class="team-column">
      <div class="column-header" id="header-team-a">主隊 / Team A</div>
      <div id="container-team-a">載入中...</div>
    </section>

    <section class="team-column">
      <div class="column-header" id="header-team-b">客隊 / Team B</div>
      <div id="container-team-b">載入中...</div>
    </section>
  </main>

  <script>
    const ALL_J1_TEAMS = [
      "岡山綠雉", "浦和紅鑽", "柏太陽王", "神戶勝利船", "鹿島鹿角",
      "川崎前鋒", "橫濱F水手", "FC東京", "廣島三箭", "大阪鋼巴",
      "大阪櫻花", "名古屋鯨魚", "町田澤維亞", "福岡黃蜂", "京都帝王",
      "湘南比馬", "新潟天鵝", "磐田喜悅", "東京綠景", "橫濱FC"
    ];

    let globalDatabase = [];

    function populateDropdowns() {
      const selectA = document.getElementById('select-team-a');
      const selectB = document.getElementById('select-team-b');

      selectA.innerHTML = '';
      selectB.innerHTML = '';

      ALL_J1_TEAMS.forEach(team => {
        const optA = document.createElement('option');
        optA.value = team;
        optA.textContent = team;
        if (team === "岡山綠雉") optA.selected = true;
        selectA.appendChild(optA);

        const optB = document.createElement('option');
        optB.value = team;
        optB.textContent = team;
        if (team === "浦和紅鑽") optB.selected = true;
        selectB.appendChild(optB);
      });

      selectA.addEventListener('change', renderPortal);
      selectB.addEventListener('change', renderPortal);
    }

    function buildCardHTML(item) {
      if (item.type === "team_info") {
        return `
          <article class="card">
            <div class="card-header">
              <h2>${item.club} (${item.club_en})</h2>
              <span class="badge badge-team">球隊資訊</span>
            </div>
            <div class="meta-list">
              <div class="meta-item"><strong>主場城市:</strong> ${item.hometown || '-'}</div>
              <div class="meta-item"><strong>城市人口:</strong> ${item.hometown_population || '-'}</div>
              <div class="meta-item"><strong>球場名稱:</strong> ${item.stadium_info?.name || '-'}</div>
              <div class="meta-item"><strong>容納人數:</strong> ${item.stadium_info?.capacity?.toLocaleString() || '-'} 人</div>
            </div>
            ${item.name_history ? `<div class="section-title">隊名由來</div><p style="font-size:0.9rem; color:#cbd5e1; margin-top:4px;">${item.name_history}</p>` : ''}
            ${item.performance_history ? `<div class="section-title">隊史榮譽</div><ul>${item.performance_history.map(h => `<li>${h}</li>`).join('')}</ul>` : ''}
          </article>
        `;
      }

      const pos = (item.position || '').toLowerCase();
      const posClass = `badge-${pos}`;
      const posDisplay = item.position === 'MANAGER' ? '總教練' : item.position;

      return `
        <article class="card">
          <div class="card-header">
            <h2>#${item.number || '-'} ${item.name_zh || item.name_en} (${item.name_en})</h2>
            <span class="badge ${posClass}">${posDisplay}</span>
          </div>
          <div class="meta-list">
            <div class="meta-item"><strong>效力球隊:</strong> ${item.club}</div>
            <div class="meta-item"><strong>國籍/註冊:</strong> ${item.nationality} (${item.registration_status})</div>
            <div class="meta-item"><strong>年齡/生日:</strong> ${item.age}歲 (${item.dob || '-'})</div>
            <div class="meta-item"><strong>身高/體重:</strong> ${item.height ? item.height + 'cm' : '-'} / ${item.weight ? item.weight + 'kg' : '-'}</div>
            <div class="meta-item"><strong>慣用腳:</strong> ${item.foot || '-'}</div>
            <div class="meta-item"><strong>在隊資歷:</strong> ${item.tenure_status || '-'}</div>
            <div class="meta-item"><strong>國家隊履歷:</strong> ${item.national_team_detail || '-'}</div>
            <div class="meta-item"><strong>前屬球會:</strong> ${item.prev_club || '-'}</div>
          </div>
          ${item.intro ? `<p style="font-size: 0.9rem;">${item.intro}</p>` : ''}
          ${item.timeline?.length ? `<div class="section-title">職業生涯履歷</div><ul>${item.timeline.map(t => `<li><strong>${t.period} (${t.team}):</strong> ${t.milestone}</li>`).join('')}</ul>` : ''}
          ${item.honors?.length ? `<div class="section-title">個人與團隊榮譽</div><ul>${item.honors.map(h => `<li>${h}</li>`).join('')}</ul>` : ''}
          ${item.tactical_traits?.length ? `<div class="section-title">戰術特點</div><ul>${item.tactical_traits.map(tt => `<li>${tt}</li>`).join('')}</ul>` : ''}
          ${item.quirky_trivia ? `<div class="trivia-box"><strong>播報花絮:</strong> ${item.quirky_trivia}</div>` : ''}
        </article>
      `;
    }

    function renderTeam(teamName, containerId, headerId) {
      const container = document.getElementById(containerId);
      const header = document.getElementById(headerId);
      header.textContent = teamName;

      const teamItems = globalDatabase.filter(item => item.club === teamName);

      if (teamItems.length === 0) {
        container.innerHTML = `
          <div class="empty-card">
            <h3>⚠️ 資料建置中</h3>
            <p><strong>${teamName}</strong> 的完整陣容資料尚未加入 <code>players_db.json</code>。</p>
          </div>
        `;
        return;
      }

      container.innerHTML = teamItems.map(item => buildCardHTML(item)).join('');
    }

    function renderPortal() {
      const teamA = document.getElementById('select-team-a').value;
      const teamB = document.getElementById('select-team-b').value;

      renderTeam(teamA, 'container-team-a', 'header-team-a');
      renderTeam(teamB, 'container-team-b', 'header-team-b');
    }

    async function loadPortalData() {
      const containerA = document.getElementById('container-team-a');
      const containerB = document.getElementById('container-team-b');

      if (window.location.protocol === 'file:') {
        const errorHTML = `
          <div class="error-card">
            <h3>⚠️ 本地檔案存取限制 (CORS Error)</h3>
            <p>請使用 <strong>Live Server</strong> 或執行 <code>python -m http.server 8000</code> 開啟此頁面。</p>
          </div>
        `;
        containerA.innerHTML = errorHTML;
        containerB.innerHTML = errorHTML;
        return;
      }

      try {
        const response = await fetch('players_db.json');
        if (!response.ok) {
          throw new Error(`無法讀取 players_db.json (HTTP ${response.status})`);
        }
        globalDatabase = await response.json();
        populateDropdowns();
        renderPortal();
      } catch (err) {
        const errHTML = `
          <div class="error-card">
            <h3>❌ 資料載入失敗</h3>
            <p>${err.message}</p>
          </div>
        `;
        containerA.innerHTML = errHTML;
        containerB.innerHTML = errHTML;
      }
    }

    document.addEventListener('DOMContentLoaded', loadPortalData);
  </script>
</body>
</html>
