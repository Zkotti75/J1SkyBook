<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J1 League Commentary Portal</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --panel-bg: #151c2c;
      --card-bg: #1b2438;
      --border-color: #2a364f;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --highlight: #f59e0b;
      --active-team-color: #e4032e;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text-muted);
    }

    .selector-bar {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .selector-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    select {
      background-color: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      outline: none;
    }

    .match-fixture-bar {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      background-color: var(--bg-main);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .team-btn {
      flex: 1;
      padding: 10px 16px;
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--text-main);
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .team-btn.active {
      background-color: var(--active-team-color);
      border-color: var(--active-team-color);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(228, 3, 46, 0.4);
    }

    .app-viewport {
      display: flex;
      flex: 1;
      height: calc(100vh - 110px);
      overflow: hidden;
    }

    .sidebar {
      width: 280px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 6px;
      background-color: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s ease;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .nav-item.active {
      background-color: rgba(255, 255, 255, 0.1);
      border-color: var(--border-color);
      border-left: 4px solid var(--active-team-color);
      font-weight: bold;
    }

    .nav-item .number {
      font-weight: bold;
      color: #64748b;
      margin-right: 8px;
      width: 32px;
      display: inline-block;
    }

    .nav-item.active .number {
      color: var(--text-main);
    }

    .nav-item .name {
      flex: 1;
    }

    .nav-item .pos-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: bold;
    }

    .nav-item-info {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      margin-bottom: 6px;
    }

    .detail-view {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      background-color: var(--bg-main);
    }

    .card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 24px;
      max-width: 1000px;
    }

    .card-banner {
      background: linear-gradient(90deg, var(--active-team-color), transparent);
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-banner h2 {
      margin: 0;
      font-size: 1.5rem;
      color: #fff;
    }

    .card-banner .subtext {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 4px;
    }

    /* Baseline Meta-List Grid Layout */
    .meta-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      background-color: rgba(0, 0, 0, 0.25);
      padding: 14px;
      border-radius: 8px;
    }

    .meta-item strong {
      color: var(--text-muted);
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #38bdf8;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    .section-content {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .nishikawa-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0 16px 0;
      font-size: 0.88rem;
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      overflow: hidden;
    }

    .nishikawa-table th {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      text-align: left;
      padding: 8px 12px;
      font-size: 0.78rem;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
    }

    .nishikawa-table td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
    }

    .nishikawa-table tr:last-child td {
      border-bottom: none;
    }

    ul.detail-bullets {
      margin: 6px 0 16px 20px;
      padding: 0;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    ul.detail-bullets li {
      margin-bottom: 4px;
    }

    .trivia-box {
      background-color: rgba(245, 158, 11, 0.1);
      border-left: 4px solid var(--highlight);
      padding: 10px 14px;
      font-size: 0.88rem;
      margin-top: 18px;
      border-radius: 0 6px 6px 0;
      color: #fef08a;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--panel-bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">J1 League 賽事播報門戶</div>
    <div class="selector-bar">
      <div class="selector-group">
        <label for="select-team-a">主隊:</label>
        <select id="select-team-a"></select>
      </div>
      <div class="selector-group">
        <label for="select-team-b">客隊:</label>
        <select id="select-team-b"></select>
      </div>
    </div>
  </header>

  <nav class="match-fixture-bar">
    <button class="team-btn active" id="btn-team-a" onclick="setActiveTeam('A')">浦和紅鑽 (Urawa)</button>
    <button class="team-btn" id="btn-team-b" onclick="setActiveTeam('B')">岡山綠雉 (Okayama)</button>
  </nav>

  <div class="app-viewport">
    <aside class="sidebar">
      <div class="nav-scroll" id="sidebar-nav-list"></div>
    </aside>

    <main class="detail-view" id="main-card-container"></main>
  </div>

  <script>
    const ALL_J1_TEAMS = [
      "浦和紅鑽", "岡山綠雉", "柏太陽王", "神戶勝利船", "鹿島鹿角",
      "川崎前鋒", "橫濱F水手", "FC東京", "廣島三箭", "大阪鋼巴",
      "大阪櫻花", "名古屋鯨魚", "町田澤維亞", "福岡黃蜂", "京都帝王",
      "湘南比馬", "新潟天鵝", "磐田喜悅", "東京綠景", "橫濱FC"
    ];

    const TEAM_COLORS = {
      "浦和紅鑽": "#e4032e",
      "岡山綠雉": "#7a0026",
      "柏太陽王": "#facc15",
      "神戶勝利船": "#991b1b",
      "DEFAULT": "#0284c7"
    };

    let globalDatabase = [];
    let activeTeamSlot = 'A';
    let activeSelectedId = null;

    function populateDropdowns() {
      const selectA = document.getElementById('select-team-a');
      const selectB = document.getElementById('select-team-b');

      selectA.innerHTML = '';
      selectB.innerHTML = '';

      ALL_J1_TEAMS.forEach(team => {
        const optA = document.createElement('option');
        optA.value = team;
        optA.textContent = team;
        if (team === "浦和紅鑽") optA.selected = true;
        selectA.appendChild(optA);

        const optB = document.createElement('option');
        optB.value = team;
        optB.textContent = team;
        if (team === "岡山綠雉") optB.selected = true;
        selectB.appendChild(optB);
      });

      selectA.addEventListener('change', () => { updateFixtureButtons(); renderActiveTeamView(); });
      selectB.addEventListener('change', () => { updateFixtureButtons(); renderActiveTeamView(); });

      updateFixtureButtons();
    }

    function updateFixtureButtons() {
      const teamA = document.getElementById('select-team-a').value;
      const teamB = document.getElementById('select-team-b').value;

      document.getElementById('btn-team-a').textContent = `${teamA}`;
      document.getElementById('btn-team-b').textContent = `${teamB}`;
    }

    function setActiveTeam(slot) {
      activeTeamSlot = slot;
      activeSelectedId = null;

      document.getElementById('btn-team-a').classList.toggle('active', slot === 'A');
      document.getElementById('btn-team-b').classList.toggle('active', slot === 'B');

      const currentTeamName = document.getElementById(slot === 'A' ? 'select-team-a' : 'select-team-b').value;
      const teamColor = TEAM_COLORS[currentTeamName] || TEAM_COLORS["DEFAULT"];
      document.documentElement.style.setProperty('--active-team-color', teamColor);

      renderActiveTeamView();
    }

    function renderActiveTeamView() {
      const currentTeamName = document.getElementById(activeTeamSlot === 'A' ? 'select-team-a' : 'select-team-b').value;
      const sidebarContainer = document.getElementById('sidebar-nav-list');

      const teamItems = globalDatabase.filter(item => item.club === currentTeamName);

      if (teamItems.length === 0) {
        sidebarContainer.innerHTML = `<div style="padding:16px; color:var(--text-muted); text-align:center;">⚠️ 陣容資料建置中</div>`;
        document.getElementById('main-card-container').innerHTML = `
          <div style="padding:40px; color:var(--text-muted); text-align:center;">
            <h3>${currentTeamName}</h3>
            <p>陣容資料尚未加入資料庫中。</p>
          </div>
        `;
        return;
      }

      const teamInfo = teamItems.find(i => i.type === "team_info");
      const manager = teamItems.find(i => i.position === "MANAGER");
      const players = teamItems.filter(i => i.position !== "MANAGER" && i.type !== "team_info")
                               .sort((a, b) => parseInt(a.number) - parseInt(b.number));

      let sidebarHTML = '';

      if (teamInfo) {
        const isActive = activeSelectedId === teamInfo.id ? 'active' : '';
        sidebarHTML += `
          <div class="nav-item nav-item-info ${isActive}" onclick="selectItem('${teamInfo.id}')">
            <span>🏛️ 球隊概覽 (Team Info)</span>
          </div>
        `;
      }

      if (manager) {
        const isActive = activeSelectedId === manager.id ? 'active' : '';
        sidebarHTML += `
          <div class="nav-item ${isActive}" onclick="selectItem('${manager.id}')">
            <span class="number">#HC</span>
            <span class="name">${manager.name_zh || manager.name_en}</span>
            <span class="pos-tag">MANAGER</span>
          </div>
        `;
      }

      players.forEach(p => {
        const isActive = activeSelectedId === p.id ? 'active' : '';
        sidebarHTML += `
          <div class="nav-item ${isActive}" onclick="selectItem('${p.id}')">
            <span class="number">#${p.number}</span>
            <span class="name">${p.name_zh || p.name_en}</span>
            <span class="pos-tag">${p.position}</span>
          </div>
        `;
      });

      sidebarContainer.innerHTML = sidebarHTML;

      if (!activeSelectedId) {
        if (teamInfo) selectItem(teamInfo.id);
        else if (players.length > 0) selectItem(players[0].id);
      }
    }

    function selectItem(id) {
      activeSelectedId = id;
      renderActiveTeamView();

      const item = globalDatabase.find(x => x.id === id);
      const detailContainer = document.getElementById('main-card-container');
      if (!item) return;

      if (item.type === "team_info") {
        detailContainer.innerHTML = `
          <article class="card">
            <div class="card-banner">
              <div>
                <h2>${item.club} (${item.club_en})</h2>
                <div class="subtext">J1 聯賽球會檔案 • 隊名由來與場館數據</div>
              </div>
            </div>
            <div class="meta-list">
              <div class="meta-item"><strong>主場城市:</strong> ${item.hometown || '-'}</div>
              <div class="meta-item"><strong>城市人口:</strong> ${item.hometown_population || '-'}</div>
              <div class="meta-item"><strong>主場球場:</strong> ${item.stadium_info?.name || '-'}</div>
              <div class="meta-item"><strong>球場容量:</strong> ${item.stadium_info?.capacity?.toLocaleString() || '-'} 人</div>
            </div>
            ${item.name_history ? `<div class="section-title">隊名歷史與由來</div><div class="section-content">${item.name_history}</div>` : ''}
            ${item.team_history ? `<div class="section-title">球會發展歷史</div><div class="section-content">${item.team_history}</div>` : ''}
            ${item.performance_history ? `<div class="section-title">主要榮譽紀錄</div><ul class="detail-bullets">${item.performance_history.map(h => `<li>${h}</li>`).join('')}</ul>` : ''}
            ${item.stadium_info?.interesting_facts ? `<div class="section-title">主場球場資訊與趣聞</div><ul class="detail-bullets">${item.stadium_info.interesting_facts.map(f => `<li>${f}</li>`).join('')}</ul>` : ''}
          </article>
        `;
        return;
      }

      // Restored Baseline Model Meta-List Grid & Full Nishikawa Template View
      detailContainer.innerHTML = `
        <article class="card">
          <div class="card-banner">
            <div>
              <h2>#${item.number || '-'} ${item.name_zh || item.name_en} (${item.name_en})</h2>
              <div class="subtext">${item.club} • ${item.position === 'MANAGER' ? '總教練' : item.position}</div>
            </div>
          </div>
          <div class="meta-list">
            <div class="meta-item"><strong>效力球隊:</strong> ${item.club}</div>
            <div class="meta-item"><strong>國籍/註冊:</strong> ${item.nationality} (${item.registration_status})</div>
            <div class="meta-item"><strong>年齡/生日:</strong> ${item.age}歲 (${item.dob || '-'})</div>
            <div class="meta-item"><strong>身高/體重:</strong> ${item.height ? item.height + 'cm' : '-'} / ${item.weight ? item.weight + 'kg' : '-'}</div>
            <div class="meta-item"><strong>慣用腳:</strong> ${item.foot || '-'}</div>
            <div class="meta-item"><strong>在隊資歷:</strong> ${item.tenure_status || '-'}</div>
            <div class="meta-item"><strong>國家隊履歷:</strong> ${item.national_team_detail || '-'}</div>
            <div class="meta-item"><strong>前屬球會:</strong> ${item.prev_club || '-'}</div>
          </div>
          ${item.intro ? `<div class="section-title">個人簡介</div><div class="section-content">${item.intro}</div>` : ''}
          
          ${item.timeline?.length ? `
            <div class="section-title">職業生涯履歷</div>
            <table class="nishikawa-table">
              <thead>
                <tr>
                  <th style="width: 20%;">時期</th>
                  <th style="width: 25%;">球隊</th>
                  <th style="width: 20%;">賽事層級</th>
                  <th style="width: 35%;">重要里程碑</th>
                </tr>
              </thead>
              <tbody>
                ${item.timeline.map(t => `
                  <tr>
                    <td><strong>${t.period}</strong></td>
                    <td>${t.team}</td>
                    <td>${t.category}</td>
                    <td>${t.milestone}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : ''}

          ${item.honors?.length ? `<div class="section-title">榮譽與獎項</div><ul class="detail-bullets">${item.honors.map(h => `<li>${h}</li>`).join('')}</ul>` : ''}
          ${item.milestones?.length ? `<div class="section-title">重要紀錄與里程碑</div><ul class="detail-bullets">${item.milestones.map(m => `<li>${m}</li>`).join('')}</ul>` : ''}
          ${item.tactical_traits?.length ? `<div class="section-title">戰術特點分析</div><ul class="detail-bullets">${item.tactical_traits.map(tt => `<li>${tt}</li>`).join('')}</ul>` : ''}
          ${item.quirky_trivia ? `<div class="trivia-box"><strong>播報花絮:</strong> ${item.quirky_trivia}</div>` : ''}
        </article>
      `;
    }

    async function loadPortalData() {
      try {
        const response = await fetch('players_db.json');
        globalDatabase = await response.json();
        populateDropdowns();
        setActiveTeam('A');
      } catch (err) {
        console.error("Data load failed:", err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadPortalData);
  </script>
</body>
</html>
